# Packs file-based tools (pointer + RID-specific) and pushes collected nupkgs.
# RID jobs are planned from each script's ToolPackageRuntimeIdentifiers / AOT / TFM.

name: publish
on:
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        description: Configuration
        options:
          - Release
          - Debug
  push:
    branches: [ main, 'dev/*' ]

env:
  DOTNET_NOLOGO: true
  MSBUILDTERMINALLOGGER: off
  Configuration: ${{ github.event.inputs.configuration || 'Release' }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  SLEET_FEED_URL: ${{ vars.SLEET_FEED_URL || 'https://pkg.kzu.app/index.json' }}

defaults:
  run:
    shell: pwsh

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-rid-packs: ${{ steps.plan.outputs.has-rid-packs }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: 🔎 plan
        id: plan
        run: ./.github/workflows/pack.ps1 -Mode plan

      - name: 📤 pack-plan
        uses: actions/upload-artifact@v4
        with:
          name: pack-plan
          path: pack-plan.json
          if-no-files-found: error

  pack:
    needs: plan
    if: needs.plan.outputs.has-rid-packs == 'true'
    name: pack-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: 📥 pack-plan
        uses: actions/download-artifact@v4
        with:
          name: pack-plan

      - name: 📦 pack
        run: ./.github/workflows/pack.ps1 -Mode rid -Rid '${{ matrix.rid }}'

      - name: 📤 package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/*.nupkg
          retention-days: 30
          if-no-files-found: error

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs-${{ matrix.rid }}
          path: '*.binlog'

  pointer:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: 📥 pack-plan
        uses: actions/download-artifact@v4
        with:
          name: pack-plan

      - name: 📦 pointer
        run: ./.github/workflows/pack.ps1 -Mode pointer

      - name: 📤 package
        uses: actions/upload-artifact@v4
        with:
          name: package-pointer
          path: artifacts/*.nupkg
          retention-days: 30
          if-no-files-found: error

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs-pointer
          path: '*.binlog'

  publish:
    needs: [plan, pack, pointer]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      needs.pointer.result == 'success' &&
      (needs.pack.result == 'success' || needs.pack.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: 📥 pack-plan
        uses: actions/download-artifact@v4
        with:
          name: pack-plan

      - name: 📥 packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: 🚀 push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          SLEET_CONNECTION: ${{ secrets.SLEET_CONNECTION }}
        run: |
          $pushNuGet = ($env:NUGET_API_KEY -and '${{ github.ref }}' -eq 'refs/heads/main')
          ./.github/workflows/pack.ps1 -Mode push -PushNuGet:$pushNuGet
